<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>禪修班雲端管理系統</title>
    <style>
        :root {
            --primary: #2d6a4f; 
            --primary-light: #d8f3dc;
            --bg: #f4f6f4;
            --card: #ffffff;
            --text: #2f3e46;
            --text-light: #6c757d;
            --danger: #d90429;
            --danger-bg: #ffe3e3;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            padding: 15px 15px 120px 15px; 
            margin: 0; 
        }
        .card { 
            background: var(--card); 
            max-width: 500px; 
            margin: 10px auto; 
            padding: 20px 15px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(45, 106, 79, 0.06); 
        }
        h2 { text-align: center; color: var(--primary); margin-top: 5px; margin-bottom: 5px; font-size: 1.4rem; font-weight: 700; }
        .status-bar { text-align: center; font-size: 12px; color: var(--text-light); margin-bottom: 15px; font-weight: 500; }
        
        /* 頂部頁籤切換 */
        .tab-nav {
            display: flex;
            background: #e2eef0;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 15px;
            gap: 2px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 4px;
            text-align: center;
            border: none;
            background: transparent;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        /* ⛩️ 第一頁：法務資訊卡片與新增表單 */
        .event-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .event-section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary);
        }
        .add-event-toggle {
            font-size: 12px;
            color: #52796f;
            cursor: pointer;
            text-decoration: underline;
            font-weight: 600;
        }
        .event-card {
            background: #fdfbf7;
            border: 1px solid #f0e6d2;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 14px;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .event-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .event-date-badge {
            background: #b7094c;
            color: white;
            font-weight: 700;
            font-size: 11px;
            padding: 3px 7px;
            border-radius: 6px;
            white-space: nowrap;
        }
        .event-title {
            font-size: 15px;
            font-weight: 700;
            color: #2b2d42;
        }
        .event-desc {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .form-btn {
            display: block;
            width: 100%;
            padding: 10px 0;
            text-align: center;
            background: var(--primary);
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .delete-event-btn {
            position: absolute;
            top: 8px;
            right: 10px;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
        }
        .add-event-form {
            background: #f8faf9;
            border: 1px dashed #2d6a4f;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            display: none;
        }
        .add-event-form input {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            box-sizing: border-box;
        }
        .submit-event-btn {
            width: 100%;
            padding: 9px;
            background: #52796f;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        /* 搜尋框與名單列表 */
        .search-container { margin-bottom: 15px; }
        .search-input {
            width: 100%; padding: 12px 16px; box-sizing: border-box; border-radius: 12px; border: 1px solid #cbd5e1; font-size: 15px; outline: none; color: var(--text);
        }

        /* 高風險與彙整卡片 */
        .risk-notice-box {
            background: #fff5f5; border: 1px solid #feb2b2; color: #c53030; padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 500; margin-bottom: 15px;
        }
        .group-summary-card {
            background: #fafcfb; border: 1px solid #e2eef0; border-radius: 14px; padding: 14px; margin-bottom: 15px;
        }
        .group-summary-title { font-size: 15px; font-weight: 700; color: var(--primary); display: flex; justify-content: space-between; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px dashed #cbd5e1; }
        .member-summary-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 14px; border-bottom: 1px solid #f0f4f2; }
        .risk-tag { color: var(--danger); font-weight: 700; font-size: 12px; background: var(--danger-bg); padding: 2px 6px; border-radius: 6px; margin-left: 6px; }
        .group-summary-footer { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #cbd5e1; display: flex; justify-content: space-between; font-size: 13px; color: var(--text-light); font-weight: 600; }

        /* 底部固定選單 */
        .bottom-panel {
            position: fixed; bottom: 0; left: 0; right: 0; background: rgba(234, 239, 236, 0.95); backdrop-filter: blur(10px); padding: 12px 20px env(safe-area-inset-bottom, 12px) 20px; border-top: 1px solid #dee5e2; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); z-index: 1000;
        }
        .panel-grid { max-width: 500px; margin: 0 auto; display: flex; gap: 10px; }
        .panel-field { flex: 1; }
        .panel-field label { display: block; font-size: 11px; font-weight: 600; color: #52796f; margin-bottom: 4px; }
        .bottom-panel select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; background: white; font-size: 14px; }
        
        .member-item { display: flex; flex-direction: column; padding: 18px 8px 12px 8px; border-bottom: 1px solid #edf2f0; }
        .member-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .member-name { font-size: 17px; font-weight: 600; color: #222e35; }
        .member-dharma { color: var(--primary); font-size: 12px; margin-left: 6px; background: var(--primary-light); padding: 2px 6px; border-radius: 6px; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 8px; background: #f0f4f1; color: #52796f; font-size: 11px; }
        .btn-group { display: flex; gap: 8px; width: 100%; }
        
        .status-btn { 
            flex: 1; min-width: 70px; padding: 10px 4px; font-size: 13px; border: 1px solid #cbd5e1; background: #ffffff; color: var(--text-light); border-radius: 10px; cursor: pointer; text-align: center; box-shadow: 0 3px 0px #cbd5e1; transform: translateY(-3px); transition: all 0.1s;
        }
        .status-btn.active { 
            background: var(--primary) !important; color: #ffffff !important; border-color: var(--primary) !important; font-weight: 600; transform: translateY(0px) !important; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3) !important; 
        }

        .loading-overlay { text-align: center; padding: 40px; color: var(--text-light); font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="activityTitle">精舍法務與管理系統</h2>
    <div id="statusMsg" class="status-bar">正在連線至雲端資料庫...</div>

    <!-- 頂部三個獨立頁籤 -->
    <div class="tab-nav">
        <button id="tab1Btn" class="tab-btn active" onclick="switchTab(1)">⛩️ 法務資訊</button>
        <button id="tab2Btn" class="tab-btn" onclick="switchTab(2)">📝 點名登錄</button>
        <button id="tab3Btn" class="tab-btn" onclick="switchTab(3)">📊 出席彙整</button>
    </div>

    <!-- 第一頁：法務資訊與 Google 表單報名 -->
    <div id="page1">
        <div class="event-section-header">
            <span class="event-section-title">最新法會與活動報名</span>
            <span class="add-event-toggle" onclick="toggleAddEventForm()">+ 新增活動</span>
        </div>

        <!-- ➕ 新增活動表單 (預設隱藏) -->
        <div id="addEventForm" class="add-event-form">
            <input type="text" id="newEventDate" placeholder="日期 (例: 8/25 (日))">
            <input type="text" id="newEventTitle" placeholder="活動名稱 (例: 供佛齋僧法會)">
            <input type="text" id="newEventDesc" placeholder="活動簡介 (例: 歡迎踴躍報名參加)">
            <input type="text" id="newEventUrl" placeholder="Google 表單網址 (https://...)">
            <button class="submit-event-btn" onclick="addNewDharmaEvent()">發布活動</button>
        </div>

        <!-- 活動卡片列表 -->
        <div id="dharmaEventContainer"></div>
    </div>

    <!-- 第二頁：點名登錄 -->
    <div id="page2" style="display: none;">
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 輸入姓名或法名快速搜尋..." oninput="renderPage2()">
        </div>
        <div id="loading" class="loading-overlay">🍵 靜心讀取名單中，請稍候...</div>
        <div id="memberContainer" class="member-list"></div>
    </div>

    <!-- 第三頁：出席彙整與高風險預警 -->
    <div id="page3" style="display: none;">
        <div class="risk-notice-box">
            <span>⚠️ <strong>高風險：</strong>連續三堂請假，請學員長關心</span>
        </div>
        <div id="summaryContainer"></div>
    </div>
</div>

<!-- 底部固定選單 (僅在第二頁與第三頁點名相關功能時顯示) -->
<div id="bottomPanel" class="bottom-panel" style="display: none;">
    <div class="panel-grid">
        <div class="panel-field">
            <label>目前點名活動</label>
            <select id="eventSelect" onchange="renderCurrentTab()"></select>
        </div>
        <div class="panel-field">
            <label>組別篩選</label>
            <select id="groupSelect" onchange="renderCurrentTab()">
                <option value="全部">全部顯示</option>
                <option value="第一組">第一組</option>
                <option value="第二組">第二組</option>
                <option value="第三組">第三組</option>
                <option value="第四組">第四組</option>
                <option value="第五組">第五組</option>
                <option value="第六組">第六組</option>
                <option value="第七組">第七組</option>
                <option value="第八組">第八組</option>
                <option value="第九組">第九組</option>
                <option value="第十組">第十組</option>
            </select>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxrrCkL3c7SnVn7LDqmN9yUH4SvjWcdbPW-rkjbem_gRfYRiSIMunP8uwudm_fkAnN5/exec";

    // 預設法務活動
    const defaultDharmaEvents = [
        {
            date: "8/25 (日)",
            title: "供佛齋僧法會",
            desc: "廣植福田，報答父母師長深恩。歡迎踴躍報名參加供僧與義工護持。",
            formUrl: "https://forms.google.com"
        }
    ];

    let dharmaEvents = JSON.parse(localStorage.getItem('dharmaEvents')) || defaultDharmaEvents;
    let rawData = [];
    let eventConfigs = [];
    let currentTab = 1;

    async function init() {
        try {
            renderDharmaEvents();

            const res = await fetch(API_URL);
            const json = await res.json();
            rawData = json.members;
            eventConfigs = json.events;

            const evSel = document.getElementById('eventSelect');
            evSel.innerHTML = '';
            eventConfigs.forEach(ev => {
                let opt = document.createElement('option');
                opt.value = ev.name; opt.innerText = ev.name;
                evSel.appendChild(opt);
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('statusMsg').innerText = "● 雲端資料庫同步成功";
            renderCurrentTab();
        } catch (e) {
            document.getElementById('statusMsg').innerText = "❌ 連線失敗，請檢查網路";
        }
    }

    function switchTab(tabNum) {
        currentTab = tabNum;
        document.getElementById('tab1Btn').classList.toggle('active', tabNum === 1);
        document.getElementById('tab2Btn').classList.toggle('active', tabNum === 2);
        document.getElementById('tab3Btn').classList.toggle('active', tabNum === 3);
        
        document.getElementById('page1').style.display = tabNum === 1 ? 'block' : 'none';
        document.getElementById('page2').style.display = tabNum === 2 ? 'block' : 'none';
        document.getElementById('page3').style.display = tabNum === 3 ? 'block' : 'none';

        // 僅在第二、三頁顯示底部篩選選單
        document.getElementById('bottomPanel').style.display = (tabNum === 1) ? 'none' : 'block';

        renderCurrentTab();
    }

    /* ⛩️ 第一頁：法務資訊管理邏輯 */
    function renderDharmaEvents() {
        const container = document.getElementById('dharmaEventContainer');
        container.innerHTML = '';

        dharmaEvents.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'event-card';
            card.innerHTML = `
                <button class="delete-event-btn" onclick="deleteDharmaEvent(${index})">✕</button>
                <div class="event-header">
                    <span class="event-date-badge">${item.date}</span>
                    <span class="event-title">${item.title}</span>
                </div>
                <div class="event-desc">${item.desc}</div>
                <a href="${item.formUrl}" target="_blank" class="form-btn">👉 點此前往 Google 表單報名</a>
            `;
            container.appendChild(card);
        });
    }

    function toggleAddEventForm() {
        const form = document.getElementById('addEventForm');
        form.style.display = (form.style.display === 'block') ? 'none' : 'block';
    }

    function addNewDharmaEvent() {
        const date = document.getElementById('newEventDate').value.trim();
        const title = document.getElementById('newEventTitle').value.trim();
        const desc = document.getElementById('newEventDesc').value.trim();
        const url = document.getElementById('newEventUrl').value.trim();

        if (!date || !title || !url) {
            alert('請填寫日期、標題與 Google 表單網址！');
            return;
        }

        dharmaEvents.unshift({ date: date, title: title, desc: desc, formUrl: url });
        localStorage.setItem('dharmaEvents', JSON.stringify(dharmaEvents));
        
        document.getElementById('newEventDate').value = '';
        document.getElementById('newEventTitle').value = '';
        document.getElementById('newEventDesc').value = '';
        document.getElementById('newEventUrl').value = '';
        toggleAddEventForm();
        renderDharmaEvents();
    }

    function deleteDharmaEvent(index) {
        if (confirm('確定要刪除這項法務訊息嗎？')) {
            dharmaEvents.splice(index, 1);
            localStorage.setItem('dharmaEvents', JSON.stringify(dharmaEvents));
            renderDharmaEvents();
        }
    }

    function renderCurrentTab() {
        const currentEvent = document.getElementById('eventSelect').value;
        if (currentTab === 1) {
            document.getElementById('activityTitle').innerText = "精舍法務與報名";
        } else {
            if (currentEvent) document.getElementById('activityTitle').innerText = currentEvent;
            if (currentTab === 2) renderPage2();
            else if (currentTab === 3) renderPage3();
        }
    }

    function checkHighRisk(memberRow) {
        const headers = rawData[0];
        let leaveCount = 0;
        for (let c = headers.length - 1; c >= 3; c--) {
            const val = (memberRow[c] || "").toString().trim();
            if (val === "請假" || val === "不參加") {
                leaveCount++;
                if (leaveCount >= 3) return true;
            } else if (val !== "") {
                break; 
            }
        }
        return false;
    }

    /* 第二頁：點名登錄 (含自動過濾無效空白列) */
    function renderPage2() {
        const container = document.getElementById('memberContainer');
        const currentEvent = document.getElementById('eventSelect').value;
        const currentGroup = document.getElementById('groupSelect').value;
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        
        if (!currentEvent || rawData.length === 0) return;

        const config = eventConfigs.find(e => e.name === currentEvent);
        const headers = rawData[0];
        const eventColIndex = headers.findIndex(h => h && h.toString().trim() === currentEvent.trim());
        
        container.innerHTML = '';

        for(let i = 1; i < rawData.length; i++) {
            const row = rawData[i];
            const group = row[0];
            const name = row[1];
            const dharmaName = row[2] || '';

            // 🛡️ 過濾空白：若無姓名或姓名全為空白，直接跳過不繪製卡片
            if (!name || name.toString().trim() === '') continue;
            
            let currentStatus = '';
            if (eventColIndex !== -1 && row[eventColIndex] !== undefined && row[eventColIndex] !== null) {
                currentStatus = row[eventColIndex].toString().trim();
            }

            const matchGroup = (currentGroup === "全部" || group === currentGroup);
            const matchKeyword = (!keyword || name.toLowerCase().includes(keyword) || dharmaName.toLowerCase().includes(keyword));

            if (matchGroup && matchKeyword) {
                const div = document.createElement('div');
                div.className = 'member-item';

                let buttonsHTML = config.options.map(opt => {
                    const isMatch = (currentStatus === opt.trim());
                    const isActive = isMatch ? 'active' : '';
                    return `<button class="status-btn ${isActive}" onclick="update('${name}', '${currentEvent}', '${opt}', this)">${opt}</button>`;
                }).join('');

                const dharmaHTML = dharmaName ? `<span class="member-dharma">${dharmaName}</span>` : '';

                div.innerHTML = `
                    <div class="member-header">
                        <div>
                            <span class="member-name">${name}</span>
                            ${dharmaHTML}
                        </div>
                        <div class="badge">${group}</div>
                    </div>
                    <div class="btn-group">${buttonsHTML}</div>
                `;
                container.appendChild(div);
            }
        }
    }

    /* 第三頁：出席彙整 (含自動過濾無效空白列) */
    function renderPage3() {
        const container = document.getElementById('summaryContainer');
        const currentEvent = document.getElementById('eventSelect').value;
        const currentGroup = document.getElementById('groupSelect').value;
        
        if (!currentEvent || rawData.length === 0) return;

        const headers = rawData[0];
        const eventColIndex = headers.findIndex(h => h && h.toString().trim() === currentEvent.trim());
        const groups = {};

        for (let i = 1; i < rawData.length; i++) {
            const row = rawData[i];
            const groupName = row[0] || "未分組";
            const name = row[1];
            const dharmaName = row[2] || '';

            // 🛡️ 過濾空白：若無姓名或姓名全為空白，直接跳過不計入彙整
            if (!name || name.toString().trim() === '') continue;

            const status = eventColIndex !== -1 ? (row[eventColIndex] || "未點名").toString().trim() : "未點名";
            const isRisk = checkHighRisk(row);

            if (currentGroup !== "全部" && groupName !== currentGroup) continue;
            if (!groups[groupName]) groups[groupName] = [];

            groups[groupName].push({ name, dharmaName, status, isRisk });
        }

        container.innerHTML = '';
        const groupOrder = ["第一組", "第二組", "第三組", "第四組", "第五組", "第六組", "第七組", "第八組", "第九組", "第十組"];

        Object.keys(groups).sort((a, b) => {
            let indexA = groupOrder.indexOf(a), indexB = groupOrder.indexOf(b);
            return (indexA === -1 ? 99 : indexA) - (indexB === -1 ? 99 : indexB);
        }).forEach(gName => {
            const members = groups[gName];
            const card = document.createElement('div');
            card.className = 'group-summary-card';

            let totalMembers = members.length, checkedMembers = 0, attendedMembers = 0;

            let rowsHTML = members.map(m => {
                const riskBadge = m.isRisk ? `<span class="risk-tag">高風險</span>` : '';
                const dharmaHTML = m.dharmaName ? `(${m.dharmaName})` : '';
                let statusColor = '#2f3e46';
                if (m.status === '請假' || m.status === '不參加') {
                    statusColor = '#d90429'; checkedMembers++;
                } else if (m.status === '未點名') {
                    statusColor = '#94a3b8';
                } else {
                    checkedMembers++; attendedMembers++;
                }
                return `
                    <div class="member-summary-row">
                        <div><strong>${m.name}</strong> <small style="color:#6c757d">${dharmaHTML}</small>${riskBadge}</div>
                        <div style="font-weight: 600; color: ${statusColor};">${m.status}</div>
                    </div>
                `;
            }).join('');

            const attendRate = totalMembers > 0 ? Math.round((attendedMembers / totalMembers) * 100) : 0;
            const checkRate = totalMembers > 0 ? Math.round((checkedMembers / totalMembers) * 100) : 0;

            card.innerHTML = `
                <div class="group-summary-title"><span>${gName}</span><span>共 ${totalMembers} 人</span></div>
                <div>${rowsHTML}</div>
                <div class="group-summary-footer">
                    <span>已點名: <strong>${checkRate}%</strong> (${checkedMembers}/${totalMembers})</span>
                    <span>出席率: <strong>${attendRate}%</strong></span>
                </div>
            `;
            container.appendChild(card);
        });
    }

    async function update(name, eventName, newVal, clickedBtn) {
        if (clickedBtn.classList.contains('active')) return;

        const btnGroup = clickedBtn.parentElement;
        btnGroup.querySelectorAll('.status-btn').forEach(btn => btn.classList.remove('active'));
        clickedBtn.classList.add('active');
        document.getElementById('statusMsg').innerText = `已變更 ${name} 至【${newVal}】，正在同步雲端...`;

        const headers = rawData[0];
        let eventColIndex = headers.findIndex(h => h && h.toString().trim() === eventName.trim());
        if (eventColIndex === -1) {
            headers.push(eventName);
            eventColIndex = headers.length - 1;
        }
        for(let i = 1; i < rawData.length; i++){
            if(rawData[i][1] === name) { rawData[i][eventColIndex] = newVal; break; }
        }

        try {
            fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ name: name, event: eventName, status: newVal })
            }).then(() => {
                document.getElementById('statusMsg').innerText = `✅ ${name} 已成功同步至雲端試算表`;
            });
        } catch (e) {
            document.getElementById('statusMsg').innerText = `⚠️ 背景同步可能受阻，請重新整理網頁`;
        }
    }

    init();
</script>

</body>
</html>
